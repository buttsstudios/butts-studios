# Butts Studios Nginx Configuration

server {
    listen 80;
    server_name butts-studios.local;  # Update with actual domain

    # Root directory for Butts Studios
    root /Users/latarencebutts/ahl/latarence/butts-studios;
    index index.html index.htm;

    # Logging
    access_log /Users/latarencebutts/ahl/latarence/nginx/butts-studios-access.log;
    error_log /Users/latarencebutts/ahl/latarence/nginx/butts-studios-error.log;

    # Main location block
    location / {
        try_files $uri $uri/ =404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
